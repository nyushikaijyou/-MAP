<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#102a43;--blue:#1769aa;--bg:#f3f6fa;--line:#dbe3ec}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;color:#203040;background:var(--bg)}
header{background:linear-gradient(120deg,#102a43,#1769aa);color:white;padding:24px clamp(16px,4vw,48px)}
header h1{font-size:clamp(22px,3vw,34px);margin:0 0 8px}header p{margin:0;color:#e2edf7}
main{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:18px}
.panel{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 4px 18px #19334d0a}
.panel h2{font-size:17px;margin:0;padding:15px 17px;border-bottom:1px solid var(--line)}
.controls{padding:12px;display:grid;gap:9px}.controls input,.controls select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
#map{height:68vh;min-height:500px;width:100%;background:#e8eef3}.mapnote{padding:10px 14px;font-size:12px;color:#617284;border-top:1px solid var(--line)}
.results{max-height:54vh;overflow:auto}.loc{padding:13px 15px;border-bottom:1px solid #edf1f5}.loc:last-child{border:0}.loc strong{display:block;font-size:14px}.loc .sub{font-size:12px;color:#617284;margin:4px 0 8px}
button,.linkbtn{border:0;border-radius:7px;background:var(--blue);color:#fff;padding:8px 11px;font:inherit;font-size:12px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.linkbtn:hover{background:#0d4f83}.loc a{margin-left:5px}
#schedule{max-height:40vh;overflow:auto}.event{padding:10px 15px;border-bottom:1px solid #edf1f5;font-size:13px;display:flex;gap:12px}.date{min-width:48px;color:var(--blue);font-weight:700}
.notice{margin:0;padding:12px 16px;font-size:12px;color:#6b4d16;background:#fff7df;border-top:1px solid #f1dfaa}
#status{padding:8px 14px;font-size:12px;color:#1769aa}
@media(max-width:850px){main{grid-template-columns:1fr;padding:10px}#map{height:55vh;min-height:380px}.results{max-height:45vh}}
</style></head><body>
<header><h1>2027年度 私立医学部入試日程・会場マップ</h1><p>試験日程と会場住所を検索し、地図上で場所を確認するための個人用ツール</p></header>
<main>
<section class="panel">
<h2>試験会場を検索</h2><div class="controls">
<input id="q" placeholder="大学名・会場名・住所で検索">
<select id="city"><option value="">すべての地域</option></select>
<select id="school"><option value="">すべての大学</option></select>
</div><div id="locCount" class="mapnote"></div><div id="locations" class="results"></div>
<h2>日程一覧（資料記載）</h2><div class="controls"><input id="dateq" placeholder="日付や大学名で日程を検索（例：2/13）"></div><div id="schedule"></div>
<p class="notice">注意：日程は添付資料の「予定」情報を転記したものです。会場と日付の対応が資料上で明確でない場合があるため、必ず大学公式の最新募集要項で確認してください。</p>
</section>
<section class="panel"><h2>日本地図</h2><div id="map"></div><div id="status">会場一覧の「地図に表示」を押すと、その住所を検索して地図にピンを表示します。</div><div class="mapnote">地図：OpenStreetMap / Leaflet。住所検索にはNominatimを使用します（選択した会場のみ検索）。</div></section>
</main>
