function initMap(){if(!window.L){$('status').textContent='地図ライブラリを読み込めませんでした。会場一覧・日程検索は利用できます。インターネット接続後に再読み込みしてください。';$('map').innerHTML='<div style="padding:24px;color:#526579">地図の読み込みに失敗しました。下の会場一覧から Google Maps を開けます。</div>';return;}try{map=L.map('map').setView([36.3,138.2],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);markers=L.layerGroup().addTo(map);const grouped={};DATA.locations.forEach(x=>{const p=regionCoords[x.city];if(p)grouped[x.city]=p});Object.entries(grouped).forEach(([city,p])=>L.circleMarker(p,{radius:6,color:'#1769aa',fillColor:'#1769aa',fillOpacity:.8}).addTo(markers).bindPopup('<b>'+esc(city)+'</b><br>地域の概略位置'));setTimeout(()=>map.invalidateSize(),250);$('status').textContent='地図を表示しました。青い点は地域の概略位置です。会場を選ぶと住所に基づくピンを表示します。';}catch(e){$('status').textContent='地図の初期化に失敗しました：'+e.message;}}

async function geocode(x){const key=x.address+' '+x.name;if(geoCache[key])return geoCache[key];const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(key+' Japan');const r=await fetch(url,{headers:{'Accept-Language':'ja'}});if(!r.ok)throw Error('住所検索サービスが応答しません');const a=await r.json();if(!a.length)throw Error('住所から位置を特定できませんでした');return geoCache[key]=[Number(a[0].lat),Number(a[0].lon)];}
async function showVenue(x){if(!map){$('status').textContent='地図が利用できません。Google Mapsリンクをご利用ください。';return;} $('status').textContent='住所を検索中：'+x.name;try{const p=await geocode(x);if(venueMarker)map.removeLayer(venueMarker);venueMarker=L.marker(p).addTo(map).bindPopup('<b>'+esc(x.name)+'</b><br>'+esc(x.school)+'<br>'+esc(x.address)+'<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.address+' '+x.name)+'">Google Mapsで開く</a>').openPopup();map.setView(p,15);$('status').textContent='表示中：'+x.name+'（'+x.address+'）';}catch(e){$('status').textContent=e.message+'。Google Mapsボタンから位置を確認できます。';}}
async function showAll(){if(!map){$('status').textContent='地図が利用できません。会場一覧からGoogle Mapsを開いてください。';return;}if(!active.length){$('status').textContent='表示対象の会場がありません。';return;}const bounds=[];let done=0;$('status').textContent=`会場の位置を取得しています（0 / ${active.length}）。多数の住所を検索するため少し時間がかかります。`;for(const x of active){try{const p=await geocode(x);L.circleMarker(p,{radius:7,color:'#1769aa',fillColor:'#1769aa',fillOpacity:.85}).addTo(markers).bindPopup('<b>'+esc(x.name)+'</b><br>'+esc(x.school)+'<br>'+esc(x.address)+'<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.address+' '+x.name)+'">Google Maps</a>');bounds.push(p);}catch(e){}done++;$('status').textContent=`会場の位置を取得しています（${done} / ${active.length}）。`;await new Promise(r=>setTimeout(r,1100));}if(bounds.length){map.fitBounds(bounds,{padding:[25,25],maxZoom:10});$('status').textContent=`${bounds.length} / ${active.length} 会場を地図に表示しました。見つからなかった住所はGoogle Mapsで確認してください。`;}else $('status').textContent='会場の位置を取得できませんでした。ネット接続を確認してください。';}
function renderSchedule(){const q=$('dateq').value.trim().toLowerCase();const a=DATA.schedule.filter(x=>(!q||(x.date+' '+x.text).toLowerCase().includes(q))&&(!$('dateFilter').value||x.date===$('dateFilter').value));$('schedule').innerHTML=a.map((x,i)=>`<div class="event"><span class="date">${esc(x.date)}</span><span>${esc(x.text)}</span><button type="button" class="secondary" data-date="${esc(x.date)}">この日で絞る</button></div>`).join('')||'<div class="event">該当する日程はありません。</div>'; $('schedule').querySelectorAll('button[data-date]').forEach(b=>b.onclick=()=>{$('dateFilter').value=b.dataset.date;render();renderSchedule();});}
['q','city','school','dateFilter'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',()=>{render();renderSchedule();}));$('dateq').addEventListener('input',renderSchedule);$('showAll').addEventListener('click',showAll);
render();renderSchedule();initMap();
</script>
</body></html>
